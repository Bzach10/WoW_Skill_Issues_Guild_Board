[tool.pytest.ini_options]
# CI runs bare `pytest`, which does not put the repo root on sys.path.
# pythonpath ensures `import guild_board` works everywhere.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus import sorting. The ignores are style
# choices the existing code makes on purpose (one-letter loop vars,
# semicolon one-liners, sys.path inserts before imports in scripts).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741", "E702", "E731", "E401", "E402"]
