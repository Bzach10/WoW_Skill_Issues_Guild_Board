# One-shot: character media (render URLs) for the 12 crew absent from the
# profile cache's roster scope. Artifact-only. Unblocks the nano campaign's
# held list without touching the standing refresh.
name: held-char-media-fetch
on: { workflow_dispatch: {} }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch media per character
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, base64
          cid, sec = os.environ["BLIZZARD_CLIENT_ID"], os.environ["BLIZZARD_CLIENT_SECRET"]
          tok_req = urllib.request.Request("https://oauth.battle.net/token",
              data=b"grant_type=client_credentials",
              headers={"Authorization": "Basic " + base64.b64encode(f"{cid}:{sec}".encode()).decode()})
          tok = json.load(urllib.request.urlopen(tok_req))["access_token"]
          CHARS = [  # (realm_slug, exact name)
            ("malganis","danukira"),("laughing-skull","erosina"),("stormrage","glaiveshott"),
            ("shadow-council","guloot"),("kalecgos","kao"),("zuljin","katesthio"),
            ("elune","madreezus"),("malganis","marceau"),("tichondrius","néfèrtítì"),
            ("bleeding-hollow","phyrthesham"),("senjin","réi"),("stormrage","sewenity")]
          out = {}
          for realm, name in CHARS:
              enc = urllib.parse.quote(name.lower())
              url = (f"https://us.api.blizzard.com/profile/wow/character/{realm}/{enc}"
                     f"/character-media?namespace=profile-us&locale=en_US")
              key = f"{name}-{realm}"
              try:
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
                  m = json.load(urllib.request.urlopen(req))
                  out[key] = {"assets": m.get("assets"), "ok": True}
                  print("ok", key)
              except Exception as e:
                  out[key] = {"ok": False, "error": str(e)[:120]}
                  print("FAIL", key, str(e)[:80])
          json.dump(out, open("held_char_media.json","w"), ensure_ascii=False, indent=1)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: held-char-media, path: held_char_media.json }
