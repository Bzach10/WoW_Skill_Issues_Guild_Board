name: Blizzard Profile Refresh

# Separate from Weekly Guild Board on purpose: this is a pure data refresh
# with no GPU/rendering step, so it can run unattended on GitHub's runners.
# It reads the roster_cache.json already committed by the weekly board run
# and never touches board rendering or the Discord post.
#
# Three independent refreshes run here, each gated + fail-soft on its own:
#   1. per-character profiles (gender/race/class/spec + transmog render URL
#      + per-slot equipment)  -> blizzard_profile_cache.json
#   2. guild-level data (achievements + activity)
#      -> blizzard_guild_cache.json
#   3. per-character TRADING CARD data — every useful Profile API endpoint
#      (identity, gear, the stats panel, achievements, the statistics panel,
#      titles, keystone runs, professions, collections, PvP, raid kills),
#      slimmed at fetch time  -> blizzard_card_cache.json
#                             +  blizzard_statistic_catalog.json
# The guild cache is what populates the site's trophy hall (layer 3) and the
# authoritative per-boss raid-island completion (layer 4). The card cache is
# the TCG's data plane and nothing on the board or the site reads it, so it
# can fail whole without touching anything that ships today.
#
# WHY THE CARD STEP LIVES ON THIS WEEKLY CRON, not the daily 11:30 job:
# a card is a DATED SNAPSHOT — the game reads frozen printings, and printings
# mint on the chapter boundary. Tuesday 13:15 UTC IS that boundary (it trails
# the weekly board's 13:00 run). Cost is not the reason: the sweep is ~2,550
# requests, ~7% of one hour's client budget and ~90s of wall clock, so the
# daily job could absorb it if the site ever wants a daily LIVE view beside
# the weekly printings.
#
# No-ops cleanly until BOTH of these exist:
#   1. blizzard.enabled: true in config.yml
#   2. the BLIZZARD_CLIENT_ID / BLIZZARD_CLIENT_SECRET repo secrets
# See SETUP_BLIZZARD.md for the one-time setup.

on:
  schedule:
    # Tuesday 13:15 UTC: 15 minutes after the weekly board's 13:00 UTC run,
    # so this picks up that run's freshly-updated roster_cache.json.
    # Note: staggered before WCL Parse Refresh (14:00) to reduce conflicts
    - cron: "15 13 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh even if the caches are still fresh"
        type: boolean
        required: false
      cards_limit:
        description: >-
          Card data: fetch only the first N roster characters (a cheap probe
          run — 0 or blank means the whole roster). Digits only.
        type: string
        required: false

jobs:
  refresh-blizzard-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better merge detection

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Blizzard profile cache (profiles + equipment)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # The dispatch input is free text. It is bound to an env var here
          # and read as "$VAR" below — never spliced into the script body.
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ "$FORCE" == "true" ]; then
            args+=(--force)
          fi
          python scripts/refresh_blizzard_profiles.py "${args[@]}"

      - name: Refresh Blizzard guild cache (achievements + activity)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Same binding rule as above — see the profiles step.
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ "$FORCE" == "true" ]; then
            args+=(--force)
          fi
          python scripts/refresh_guild_data.py "${args[@]}"

      - name: Refresh Blizzard trading-card data (every profile endpoint)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Same binding rule as the steps above — dispatch inputs are free
          # text and are read as "$VAR", never spliced into the script body.
          FORCE: ${{ github.event.inputs.force }}
          CARDS_LIMIT: ${{ github.event.inputs.cards_limit }}
        run: |
          args=()
          if [ "$FORCE" == "true" ]; then
            args+=(--force)
          fi
          # Digits only: a non-numeric input is ignored rather than passed on,
          # so a typo cannot turn into an argparse failure that reds the job.
          case "$CARDS_LIMIT" in
            ''|*[!0-9]*) ;;
            0) ;;
            *) args+=(--limit "$CARDS_LIMIT") ;;
          esac
          python scripts/refresh_blizzard_cards.py "${args[@]}"

      - name: Refresh competition so the rebuilt bundle is ONE moment
        # THE 2026-07-28 FIX. build_site_data.py stamps generated_at = now on
        # every layer it writes, but competition.json carries `based_on` from
        # competition_cache.json — which only moves when THIS script runs. So a
        # rebuild that skips it emits a bundle whose stamps span the gap since
        # the last competition pull, and the consumer's 30-minute vintage guard
        # refuses the whole delivery. On 2026-07-28 that gap reached 10h54m and
        # the public site sat on a two-day-old raid number while every layer in
        # this repo was fresh. Raider.io public API, no credentials, fail-open.
        run: python scripts/refresh_competition.py

      - name: Rebuild the site data bundle (layers 3 & 4 now fill)
        # --live-dungeons does the Raider.io roster sweep so layer 4's dungeon
        # islands populate too (public API, no creds); guild achievements
        # (committed above) drive the raid side.
        run: python scripts/build_site_data.py --live-dungeons --out web_data_public

      - name: Validate the bundle (cross-layer consistency gate)
        # This workflow was the ONLY bundle-rebuilding job without this gate,
        # which is how the mixed-vintage bundles of 2026-07-28 reached main.
        run: python scripts/validate_bundle.py web_data_public

      - name: Commit refreshed Blizzard data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # The caches are the credentialed source data; the rebuilt bundle
          # under web_data_public/ is what the site serves. The card cache and
          # its statistic catalog are the TCG's source data — added with -f
          # guards absent, since a probe run may legitimately not write them.
          # competition_cache.json rides along because this job now refreshes
          # it (see the coherence step above) -- committing the bundle without
          # the cache that produced it would re-open the same vintage gap.
          CACHES="blizzard_profile_cache.json blizzard_guild_cache.json competition_cache.json"
          CARDS="blizzard_card_cache.json blizzard_statistic_catalog.json"
          git add $CACHES web_data_public
          for f in $CARDS; do
            # `&& ... || true`: the runner's shell is `bash -e`, so a bare
            # failing test would abort the step on a probe run that wrote
            # neither file.
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "No Blizzard data changes to commit."
          else
            git commit -m "Update Blizzard profile + guild + card data [skip ci]"
            # Drop unstaged leftovers (roster_reconciliation.json, web_stats.json
            # et al., rewritten by build_site_data) BEFORE the rebase. Without
            # this, `git pull --rebase` refuses with "cannot pull with rebase:
            # You have unstaged changes" and the commit is stranded on the
            # runner — which is exactly what run 30332438237 did, and the same
            # failure daily-data-refresh.yml already carries this fix for.
            git checkout -- .
            # Fetch to ensure we have the latest from origin
            git fetch origin
            if git pull --no-rebase origin "$REF_NAME"; then
              # Fast-forward merge succeeded
              git push
            else
              # Merge conflict occurred - resolve by keeping our version
              # (freshly refreshed Blizzard data is authoritative)
              echo "Merge conflict detected - resolving by keeping our Blizzard data..."
              git merge --abort
              # Pull with rebase strategy using 'ours' to prefer our changes
              git pull --rebase -X ours origin "$REF_NAME" || {
                # If rebase still fails, manually resolve by taking our version
                echo "Rebase conflict - resolving conflicts by keeping our version..."
                for f in $CACHES $CARDS; do
                  git checkout --ours "$f" 2>/dev/null && git add "$f" || true
                done
                git add web_data_public
                git rebase --continue
              }
              git push
            fi
          fi
