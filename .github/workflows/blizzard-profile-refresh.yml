name: Blizzard Profile Refresh

# Separate from Weekly Guild Board on purpose: this is a pure data refresh
# (gender/race/class/spec + transmog render URL per character) with no
# GPU/rendering step, so it can run unattended on GitHub's runners. It
# reads the roster_cache.json already committed by the weekly board run
# and never touches board rendering or the Discord post.
#
# No-ops cleanly until BOTH of these exist:
#   1. blizzard.enabled: true in config.yml
#   2. the BLIZZARD_CLIENT_ID / BLIZZARD_CLIENT_SECRET repo secrets
# See SETUP_BLIZZARD.md for the one-time setup.

on:
  schedule:
    # 15 minutes after the weekly board's Tuesday 13:00 UTC run, so this
    # picks up that run's freshly-updated roster_cache.json.
    - cron: "15 13 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh even if the cache is still fresh"
        type: boolean
        required: false
      extra:
        description: >-
          Comma-separated extra name-realm keys (roster_cache slug shape,
          e.g. meowstal-bleeding-hollow) to refresh alongside the roster.
          Keys only — appearance data always comes from the Blizzard API.
        type: string
        required: false

jobs:
  refresh-blizzard-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Blizzard profile cache
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # The dispatch inputs are free text. They are bound to env vars
          # here and read as "$VAR" below — never spliced into the script body.
          FORCE: ${{ github.event.inputs.force }}
          EXTRA: ${{ github.event.inputs.extra }}
        run: |
          args=()
          if [ "$FORCE" == "true" ]; then
            args+=(--force)
          fi
          if [ -n "$EXTRA" ]; then
            args+=(--extra "$EXTRA")
          fi
          python scripts/refresh_blizzard_profiles.py "${args[@]}"

      - name: Commit Blizzard profile cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blizzard_profile_cache.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update Blizzard profile cache [skip ci]"
            if git pull --rebase origin "$REF_NAME"; then
              git push
            else
              git checkout --ours blizzard_profile_cache.json
              git add blizzard_profile_cache.json
              git rebase --continue
              git push
            fi
          fi
