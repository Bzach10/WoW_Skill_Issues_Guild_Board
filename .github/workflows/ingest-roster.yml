      #   run: |
      #     git config user.name  "wipefest-bot"
      #     git config user.email "bot@users.noreply.github.com"
      #     git add data/wipefest.sqlite3
      #     git commit -m "chore(data): weekly roster ingest" || echo "no change"
      #     git push
