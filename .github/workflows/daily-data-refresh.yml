name: Daily Data Refresh

# THE FULL DAILY DATA PULL — data only, nothing posts anywhere.
#
# This workflow performs one complete daily pull at 11:30 UTC:
#   1. refresh_competition — LIVE two-way guild membership (joiners in,
#      verified leavers to the departed ledger) + M+ scores/runs/ranks;
#   2. refresh_parses — per-character WCL parse averages (active sweep
#      daily, full discovery per its own cadence; inert without creds);
#   3. build_site_data — full web_data_public rebuild, raid block from the
#      live fetch or the last-good raid_progression_cache.json;
#   4. validate_bundle — the cross-layer gate; nothing inconsistent commits.
#
# NO Discord steps here, by design: the weekly board post stays Tuesday's
# (weekly-board.yml), and the daily WANTED-BOARD post remains gated off in
# daily-competition-refresh.yml (config competition.daily_post: false).
# The later competition/parse crons stay as same-day refreshers. Successful
# runs trigger Publish Website; there is no independent consumer pickup race.

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

concurrency:
  group: website-data-writer
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Full history for better merge detection

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh competition + live two-way roster (Raider.io, public)
        run: python scripts/refresh_competition.py

      - name: Refresh per-character WCL parses (inert without creds)
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python scripts/refresh_parses.py

      - name: Rebuild the site data bundle
        run: python scripts/build_site_data.py --live-dungeons --out web_data_public

      - name: Validate the bundle (cross-layer consistency gate)
        run: python scripts/validate_bundle.py web_data_public

      - name: Commit the refreshed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add competition_cache.json web_data_public
          [ -f parses_cache.json ] && git add parses_cache.json
          [ -f raid_progression_cache.json ] && git add raid_progression_cache.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily data refresh [skip ci]"
            # Drop unstaged leftovers (roster_reconciliation.json et al.) so
            # a rebase onto a moved main cannot strand this commit on the
            # runner — the 2026-07-27 weekly-board failure mode.
            git checkout -- .
            git fetch origin
            git pull --rebase -X theirs origin "$REF_NAME" || {
              echo "Rebase conflict - resolving by keeping the validated refresh..."
              for f in competition_cache.json parses_cache.json raid_progression_cache.json web_data_public; do
                git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
              done
              GIT_EDITOR=true git rebase --continue
            }
            python scripts/validate_bundle.py web_data_public
            git push
          fi

      - name: Trigger wipefest-site cloud refresh
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN unset — skip site dispatch (set this secret to enable seamless site updates)"
            exit 0
          fi
          # FAIL-OPEN (2026-08-08): this is a CONVENIENCE nudge, not a data
          # operation -- the site repo also refreshes on its own schedule and
          # pulls board data at build time, so a missed dispatch costs latency,
          # never correctness. It ran with a token that lacked dispatch scope
          # ("Resource not accessible by personal access token", HTTP 403) and
          # turned a wholly successful data refresh red every single day.
          # Data steps fail closed; notifications and nudges fail open.
          if gh api --method POST repos/Bzach10/wipefest-redesign/dispatches \
              -H "Accept: application/vnd.github+json" \
              -f event_type='site-refresh' \
              -f client_payload[source]='daily-data-refresh' \
              -f client_payload[sha]="$GITHUB_SHA"; then
            echo "site dispatch sent"
          else
            echo "::warning::site dispatch failed (token scope?) — data is safe;"\
                 "the site's own scheduled refresh will pick it up"
          fi
