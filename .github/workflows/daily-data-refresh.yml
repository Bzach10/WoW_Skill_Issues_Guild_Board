name: Daily Data Refresh

# THE FULL DAILY DATA PULL — data only, nothing posts anywhere.
#
# Owner's question (2026-07-27): "We're setup to do the full data pull on a
# daily basis correct?" The honest answer was NO: the roster swept only in
# weekly-board's Tuesday cron, and the daily competition (14:00 UTC) and
# parse (13:30 UTC) refreshes both land AFTER the consumer site's own daily
# pickup at 13:00 UTC — so the site always shipped yesterday's bundle.
#
# This workflow closes both gaps in one scheduled job, at 11:30 UTC —
# comfortably before the 13:00 UTC site pickup:
#   1. refresh_competition — LIVE two-way guild membership (joiners in,
#      verified leavers to the departed ledger) + M+ scores/runs/ranks;
#   2. refresh_parses — per-character WCL parse averages (active sweep
#      daily, full discovery per its own cadence; inert without creds);
#   3. build_site_data — full web_data_public rebuild, raid block from the
#      live fetch or the last-good raid_progression_cache.json;
#   4. validate_bundle — the cross-layer gate; nothing inconsistent commits.
#
# NO Discord steps here, by design: the weekly board post stays Tuesday's
# (weekly-board.yml), and the daily WANTED-BOARD post remains gated off in
# daily-competition-refresh.yml (config competition.daily_post: false).
# The 13:30/14:00 crons stay as same-day refreshers; this job's only role
# is a complete, fresh bundle BEFORE the site's daily delivery window.

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better merge detection

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh competition + live two-way roster (Raider.io, public)
        run: python scripts/refresh_competition.py

      - name: Refresh per-character WCL parses (inert without creds)
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python scripts/refresh_parses.py

      - name: Rebuild the site data bundle
        run: python scripts/build_site_data.py --out web_data_public

      - name: Validate the bundle (cross-layer consistency gate)
        run: python scripts/validate_bundle.py web_data_public

      # THE SEASON LEDGER. One compact line per character per completed raid
      # week, appended to season_ledger/<season-slug>.jsonl and kept forever
      # — the series the two-slot board_state.json throws away every run.
      # Idempotent on (season, week, character key): running it every day
      # writes the week once and does nothing for the rest of the week, so
      # this and the Tuesday board post can both call it safely. It also
      # freezes the outgoing season on the first run after a flip. Runs
      # AFTER validate_bundle so nothing inconsistent is ever recorded, and
      # with no secret in the environment — it reads the committed bundle.
      - name: Append the season ledger (and freeze a finished season)
        run: python -m guild_board.season_ledger --append

      - name: Commit the refreshed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add competition_cache.json web_data_public
          [ -f parses_cache.json ] && git add parses_cache.json
          [ -f raid_progression_cache.json ] && git add raid_progression_cache.json
          # Append-only ledger + the write-once season freeze. Both are
          # additive, so they never conflict on a rebase.
          [ -d season_ledger ] && git add season_ledger
          [ -d data/seasons ] && git add data/seasons
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily data refresh [skip ci]"
            # Drop unstaged leftovers (roster_reconciliation.json et al.) so
            # a rebase onto a moved main cannot strand this commit on the
            # runner — the 2026-07-27 weekly-board failure mode.
            git checkout -- .
            # Fetch to ensure we have the latest from origin
            git fetch origin
            if git pull --no-rebase origin "$REF_NAME"; then
              # Fast-forward merge succeeded
              git push
            else
              # Merge conflict occurred - resolve by keeping our version
              echo "Merge conflict detected - resolving by keeping our data..."
              git merge --abort 2>/dev/null || true
              # Pull with rebase strategy using 'theirs' to prefer our changes
              # (in rebase context, --theirs means our commit being replayed)
              git pull --rebase -X theirs origin "$REF_NAME" || {
                # If rebase still fails, manually resolve by taking our version
                echo "Rebase conflict - resolving conflicts by keeping our version..."
                for f in competition_cache.json parses_cache.json raid_progression_cache.json web_data_public; do
                  git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
                done
                GIT_EDITOR=true git rebase --continue
              }
              git push
            fi
          fi

      - name: Trigger wipefest-site cloud refresh
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN unset — skip site dispatch (set this secret to enable seamless site updates)"
            exit 0
          fi
          # FAIL-OPEN (2026-08-08): this is a CONVENIENCE nudge, not a data
          # operation -- the site repo also refreshes on its own schedule and
          # pulls board data at build time, so a missed dispatch costs latency,
          # never correctness. It ran with a token that lacked dispatch scope
          # ("Resource not accessible by personal access token", HTTP 403) and
          # turned a wholly successful data refresh red every single day.
          # Data steps fail closed; notifications and nudges fail open.
          if gh api --method POST repos/Bzach10/wipefest-redesign/dispatches \
              -H "Accept: application/vnd.github+json" \
              -f event_type='site-refresh' \
              -f client_payload[source]='daily-data-refresh' \
              -f client_payload[sha]="$GITHUB_SHA"; then
            echo "site dispatch sent"
          else
            echo "::warning::site dispatch failed (token scope?) — data is safe;"\
                 "the site's own scheduled refresh will pick it up"
          fi
