# Character sheets for the card game's stat model (SKILL ISSUE).
# v3: weekly on Tuesday 16:00 UTC (after US reset) + manual dispatch;
# commits char_stats.json as a CI-owned cache like its refresh siblings.
# The cards' numbers re-derive from this weekly - the "your card upgrades
# on reset day" cadence (owner-picked over daily, 2026-08-03).
name: char-stats-fetch
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16 * * 2"
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch character sheets
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, base64
          cid, sec = os.environ["BLIZZARD_CLIENT_ID"], os.environ["BLIZZARD_CLIENT_SECRET"]
          tok_req = urllib.request.Request("https://oauth.battle.net/token",
              data=b"grant_type=client_credentials",
              headers={"Authorization": "Basic " + base64.b64encode(f"{cid}:{sec}".encode()).decode()})
          tok = json.load(urllib.request.urlopen(tok_req))["access_token"]
          CHARS = [  # (realm_slug, lowercased name) x 118 from contract.json 2026-08-03
            ("aggramar","kirr\u00e1"),
            ("area-52","andika"),
            ("area-52","buchalter"),
            ("area-52","danethegreat"),
            ("area-52","dathar"),
            ("area-52","eny\u00f2"),
            ("area-52","evangilism"),
            ("area-52","flemel"),
            ("area-52","iamdapopemon"),
            ("area-52","maillo"),
            ("area-52","miallo"),
            ("area-52","nixfall\u00eb"),
            ("area-52","onessarain"),
            ("area-52","onetruemorty"),
            ("area-52","purcules"),
            ("area-52","rexxhavocc"),
            ("area-52","rhans\u00eck"),
            ("area-52","ricodandolo"),
            ("area-52","sandgs"),
            ("area-52","ugrage"),
            ("azgalor","coned"),
            ("azgalor","gandamar"),
            ("azgalor","wowimhealing"),
            ("azuremyst","duskwolf"),
            ("azuremyst","witherbear"),
            ("azuremyst","witherhoard"),
            ("bleeding-hollow","anbux"),
            ("bleeding-hollow","dragoonx"),
            ("bleeding-hollow","eponax"),
            ("bleeding-hollow","glaidaniss"),
            ("bleeding-hollow","holyx"),
            ("bleeding-hollow","huntlowx"),
            ("bleeding-hollow","icyx"),
            ("bleeding-hollow","meowstal"),
            ("bleeding-hollow","milkbreath"),
            ("bleeding-hollow","orx"),
            ("bleeding-hollow","oynax"),
            ("bleeding-hollow","phyrthedragn"),
            ("bleeding-hollow","phyrthepali"),
            ("bleeding-hollow","phyrthepanda"),
            ("bleeding-hollow","phyrthesham"),
            ("bleeding-hollow","rougex"),
            ("bleeding-hollow","slicerdicer"),
            ("bleeding-hollow","tinyx"),
            ("bleeding-hollow","tommybravo"),
            ("bleeding-hollow","tommybravoo"),
            ("bleeding-hollow","tommybravoox"),
            ("bleeding-hollow","tommybravox"),
            ("bleeding-hollow","tommybravoxx"),
            ("bleeding-hollow","widowx"),
            ("bleeding-hollow","wolfx"),
            ("bloodhoof","shadowhausen"),
            ("bloodscalp","devana"),
            ("dalaran","ihatepugs"),
            ("dalaran","muramorn"),
            ("eitrigg","sidarien"),
            ("eldrethalas","jilk"),
            ("eldrethalas","ravokoflight"),
            ("elune","madreezus"),
            ("emerald-dream","beroben"),
            ("emerald-dream","yost"),
            ("frostwolf","skoala"),
            ("hydraxis","boondocka"),
            ("hydraxis","heximal"),
            ("hydraxis","redgicide"),
            ("illidan","breaktheicee"),
            ("illidan","jerbane"),
            ("illidan","kitzumi"),
            ("illidan","peeoncorpses"),
            ("illidan","p\u00e4llypocket"),
            ("illidan","shadoxi"),
            ("illidan","shadoxii"),
            ("kalecgos","kao"),
            ("korgath","fluffy"),
            ("korgath","healmates"),
            ("korgath","tankmates"),
            ("laughing-skull","erosina"),
            ("lightnings-blade","hellful"),
            ("lightnings-blade","kibli"),
            ("maelstrom","scounddrel"),
            ("malganis","danukira"),
            ("malganis","ellebasi"),
            ("malganis","fuazy"),
            ("malganis","marceau"),
            ("malganis","mogaslst"),
            ("malganis","rektarn"),
            ("proudmoore","carun"),
            ("proudmoore","nokori"),
            ("proudmoore","rakbear"),
            ("proudmoore","rakdisc"),
            ("proudmoore","rakell"),
            ("proudmoore","voidrak"),
            ("proudmoore","xavira"),
            ("queldorei","arfas"),
            ("queldorei","beroben"),
            ("queldorei","fleshripper"),
            ("queldorei","floofwall"),
            ("queldorei","healyeah"),
            ("queldorei","he\u00e0lthpack"),
            ("queldorei","marvinah"),
            ("queldorei","shadowbelle"),
            ("queldorei","uddershock"),
            ("sargeras","chokalock"),
            ("sargeras","paleghost"),
            ("senjin","r\u00e9i"),
            ("shadow-council","guloot"),
            ("stormrage","amrevenge"),
            ("stormrage","glaiveshott"),
            ("stormrage","sewenity"),
            ("thrall","beastfriend"),
            ("thrall","boltzaa"),
            ("tichondrius","azerothia"),
            ("tichondrius","brewzleeh"),
            ("tichondrius","n\u00e9f\u00e8rt\u00edt\u00ec"),
            ("whisperwind","yur"),
            ("wyrmrest-accord","glinkz"),
            ("zuljin","katesthio"),
            ("zuljin","sosomage")]
          def get(path):
              url = (f"https://us.api.blizzard.com/profile/wow/character/{path}"
                     f"?namespace=profile-us&locale=en_US")
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              return json.load(urllib.request.urlopen(req))
          def slim_profile(p):
              return {
                  "level": p.get("level"), "faction": (p.get("faction") or {}).get("name"),
                  "race": (p.get("race") or {}).get("name"),
                  "class": (p.get("character_class") or {}).get("name"),
                  "active_spec": (p.get("active_spec") or {}).get("name"),
                  "equipped_item_level": p.get("equipped_item_level"),
                  "average_item_level": p.get("average_item_level"),
                  "achievement_points": p.get("achievement_points"),
                  "last_login_timestamp": p.get("last_login_timestamp")}
          def slim_specs(sp):
              out = []
              for g in sp.get("specializations", []):
                  nm = (g.get("specialization") or {}).get("name")
                  if nm: out.append(nm)
              active = ((sp.get("active_specialization") or {}).get("name"))
              return {"known": out, "active": active}
          def slim_stats(st):
              st.pop("_links", None); st.pop("character", None)
              return st
          out = {}
          for realm, name in CHARS:
              enc = urllib.parse.quote(name)
              key = f"{name}-{realm}"
              row = {}
              for label, suffix, slim in [("profile","",slim_profile),
                                          ("statistics","/statistics",slim_stats),
                                          ("specs","/specializations",slim_specs)]:
                  try:
                      row[label] = slim(get(f"{realm}/{enc}{suffix}"))
                  except Exception as e:
                      row[label] = {"error": str(e)[:120]}
              ok = all("error" not in v for v in row.values())
              out[key] = row
              print("ok" if ok else "PARTIAL", key)
          json.dump(out, open("char_stats.json","w"), ensure_ascii=False, indent=1)
          print("wrote", len(out), "characters")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: char-stats, path: char_stats.json }
      - name: Commit the cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add char_stats.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Refresh character sheets [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
