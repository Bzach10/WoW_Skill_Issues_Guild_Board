name: WCL Parse Refresh

# Per-character Warcraft Logs parse averages for the website -- the Four
# Emperors ranking's second axis, standings parse columns and the
# newspaper's raid sections. Runs here (not locally) because the WCL
# credentials exist only as Actions secrets; scripts/refresh_parses.py is
# inert without them by design.
#
# Idempotent + FAIL-OPEN: refresh_parses.py keeps the previous cache if a
# bad WCL day resolves too few characters, so parse surfaces never blank.

on:
  schedule:
    # Daily at 14:30 UTC, after the competition refresh.
    # to reduce merge conflicts on shared files like competition_cache.json
    - cron: "30 14 * * *"
  workflow_dispatch:

concurrency:
  group: website-data-writer
  cancel-in-progress: false

jobs:
  refresh-parses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Full history for better merge detection

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh per-character WCL parses
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python scripts/refresh_parses.py

      - name: Refresh competition so the rebuilt bundle is ONE moment
        # THE 2026-07-28 FIX -- see blizzard-profile-refresh.yml for the full
        # note. Short version: competition.json is the only layer that carries
        # the age of its own cache instead of the rebuild clock, so a rebuild
        # that skips this step emits a bundle the consumer's vintage guard
        # must refuse. Public Raider.io API, no credentials, fail-open.
        run: python scripts/refresh_competition.py

      - name: Rebuild the site data bundle
        # Reuses the committed caches; the parses layer is the point here.
        run: python scripts/build_site_data.py --out web_data_public

      - name: Validate the bundle (cross-layer consistency gate)
        run: python scripts/validate_bundle.py web_data_public

      - name: Commit refreshed parse data + bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # competition_cache.json rides along because this job now refreshes
          # it (see the coherence step above) -- committing the bundle without
          # the cache that produced it would re-open the same vintage gap.
          git add parses_cache.json competition_cache.json web_data_public
          [ -f raid_progression_cache.json ] && git add raid_progression_cache.json
          if git diff --cached --quiet; then
            echo "No parse changes to commit."
          else
            git commit -m "Refresh WCL parse data [skip ci]"
            # Drop unstaged leftovers before the rebase to prevent conflicts
            git checkout -- .
            git fetch origin
            git pull --rebase -X theirs origin "$REF_NAME" || {
              git checkout --theirs parses_cache.json competition_cache.json web_data_public
              [ -f raid_progression_cache.json ] && git checkout --theirs raid_progression_cache.json
              git add parses_cache.json competition_cache.json web_data_public
              [ -f raid_progression_cache.json ] && git add raid_progression_cache.json
              GIT_EDITOR=true git rebase --continue
            }
            python scripts/validate_bundle.py web_data_public
            git push
          fi
