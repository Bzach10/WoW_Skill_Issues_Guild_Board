name: Guild Pulse Refresh

# The website's living Discord feed (chat highlights, memes, banter). Runs
# more often than the weekly data refreshes because a "hangout heartbeat"
# wants to feel current — but it is cheap: it only reads the allowlisted
# guild-public channels and rebuilds the bundle from already-committed
# caches (no full roster sweep here).
#
# Uses the SAME read-only DISCORD_BOT_TOKEN the weekly board already uses.
# No-ops cleanly until:
#   1. discord_inputs.enabled: true AND discord_inputs.pulse_channels set
#      in config.yml, and
#   2. the DISCORD_BOT_TOKEN repo secret exists.
#
# PRIVACY: only channels in discord_inputs.pulse_channels are read. See the
# privacy model in guild_board/discord_inputs.py and WEB_DATA_CONTRACT.md.

on:
  schedule:
    # Every 6 hours. Tune to taste — more frequent = more "live", but each
    # run may add a commit.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh-guild-pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh the guild pulse cache (allowlisted channels only)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/refresh_guild_pulse.py

      - name: Refresh competition so the rebuilt bundle is ONE moment
        # THE 2026-07-28 FIX -- see blizzard-profile-refresh.yml for the full
        # note. This job runs every 6 hours and was the most frequent producer
        # of mixed-vintage bundles: four times a day it re-stamped every layer
        # with `now` while competition.based_on stayed put, and each of those
        # bundles was uningestible by the site. Public API, no credentials.
        run: python scripts/refresh_competition.py

      - name: Rebuild the site bundle (reuses committed data caches)
        # No --live-dungeons here: this is the frequent feed refresh, so it
        # reuses the dungeon/guild caches the weekly Blizzard Action committed.
        run: python scripts/build_site_data.py --out web_data_public

      - name: Validate the bundle (cross-layer consistency gate)
        run: python scripts/validate_bundle.py web_data_public

      - name: Commit refreshed pulse + bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # The cache is untracked and only written once discord_inputs.
          # pulse_channels is configured AND the bot token secret exists —
          # until then the refresh script no-ops and the file is absent.
          [ -f guild_pulse_cache.json ] && git add guild_pulse_cache.json
          [ -f raid_progression_cache.json ] && git add raid_progression_cache.json
          # competition_cache.json rides along because this job now refreshes
          # it (see the coherence step above) -- committing the bundle without
          # the cache that produced it would re-open the same vintage gap.
          git add competition_cache.json web_data_public
          if git diff --cached --quiet; then
            echo "No pulse changes to commit."
          else
            git commit -m "Refresh guild pulse feed [skip ci]"
            git checkout -- .
            if git pull --rebase origin "$REF_NAME"; then
              git push
            else
              for f in guild_pulse_cache.json web_data_public raid_progression_cache.json; do
                git checkout --ours "$f" 2>/dev/null && git add "$f" || true
              done
              git rebase --continue
              git push
            fi
          fi
