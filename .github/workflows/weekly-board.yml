name: Weekly Guild Board

on:
  schedule:
    # Every Tuesday at 13:00 UTC (9 AM ET) — right before NA reset,
    # so it captures the full previous raid week.
    - cron: "0 13 * * 2"
  # This adds the "Run workflow" button so officers can post/repost
  # the board manually any time (e.g., after updating the roast).
  workflow_dispatch:
    inputs:
      roast:
        description: "Override the roast of the week"
        required: false
      roast_winner:
        description: "Who said the roast"
        required: false
      roast_target:
        description: "Who the roast is aimed at"
        required: false
      difficulty:
        description: "Override raid difficulty (normal, heroic, mythic)"
        required: false
      lookback:
        description: "Override lookback days"
        required: false
      dry_run:
        description: "Dry run only (do not post to Discord)"
        type: boolean
        required: false

jobs:
  post-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts for board rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install Chromium for the HTML renderer
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest

      - name: Build and post the board
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          args=()
          if [ -n "${{ github.event.inputs.roast }}" ]; then
            args+=(--roast "${{ github.event.inputs.roast }}")
          fi
          if [ -n "${{ github.event.inputs.roast_winner }}" ]; then
            args+=(--roast-winner "${{ github.event.inputs.roast_winner }}")
          fi
          if [ -n "${{ github.event.inputs.roast_target }}" ]; then
            args+=(--roast-target "${{ github.event.inputs.roast_target }}")
          fi
          if [ -n "${{ github.event.inputs.difficulty }}" ]; then
            args+=(--difficulty ${{ github.event.inputs.difficulty }})
          fi
          if [ -n "${{ github.event.inputs.lookback }}" ]; then
            args+=(--lookback ${{ github.event.inputs.lookback }})
          fi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            args+=(--dry-run)
          fi
          python leaderboard.py "${args[@]}"

      - name: Publish web board to GitHub Pages
        env:
          WEB_BOARD_TOKEN: ${{ secrets.WEB_BOARD_TOKEN }}
        run: |
          if [ ! -f site/index.html ]; then
            echo "No web board rendered this run; skipping publish."
            exit 0
          fi
          if [ -z "$WEB_BOARD_TOKEN" ]; then
            echo "WEB_BOARD_TOKEN secret not set; skipping web publish (see README 'Web board')."
            exit 0
          fi
          repo=$(python -c "import yaml; print((((yaml.safe_load(open('config.yml')).get('display') or {}).get('web_board') or {}).get('repo') or ''))")
          if [ -z "$repo" ]; then
            echo "display.web_board.repo not set in config.yml; skipping."
            exit 0
          fi
          remote="https://x-access-token:${WEB_BOARD_TOKEN}@github.com/${repo}.git"
          # Preserve history: build on the existing gh-pages so the week
          # archive accumulates instead of being wiped every Tuesday.
          if git clone -q --depth 1 --branch gh-pages "$remote" pages 2>/dev/null; then
            echo "Extending existing gh-pages."
          else
            mkdir -p pages
            git -C pages init -q -b gh-pages
            echo "Starting a fresh gh-pages."
          fi
          git -C pages config user.email "action@github.com"
          git -C pages config user.name "GitHub Action"
          mkdir -p pages/archive pages/data
          week=$(date -u +%F)
          cp site/index.html pages/index.html
          cp site/index.html "pages/archive/${week}.html"
          # State snapshot per week — raw material for future trend graphs
          [ -f board_state.json ] && cp board_state.json "pages/data/${week}-state.json"
          [ -f web_stats.json ] && cp web_stats.json "pages/data/${week}-web-stats.json"
          # Manifest the archive dropdown reads (newest first)
          (cd pages/archive && ls -1 *.html 2>/dev/null | sed 's/\.html$//' | sort -r \
            | python -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
            > index.json)
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Web board unchanged; nothing to publish."
          else
            git commit -q -m "Weekly web board ${week}"
            git push -q "$remote" gh-pages
            echo "Web board published (archive week ${week})."
          fi

      - name: Commit roster cache and board state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add roster_cache.json
          [ -f board_state.json ] && git add board_state.json
          [ -f web_stats.json ] && git add web_stats.json
          if git diff --cached --quiet; then
            echo "No cache/state changes to commit."
          else
            git commit -m "Update roster cache and board state [skip ci]"
            if git pull --rebase origin ${{ github.ref_name }}; then
              git push
            else
              for f in roster_cache.json board_state.json web_stats.json; do
                git checkout --ours "$f" 2>/dev/null && git add "$f" || true
              done
              git rebase --continue
              git push
            fi
          fi
