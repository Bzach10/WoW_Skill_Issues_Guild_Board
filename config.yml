# ============================================================
#  GUILD BOARD SETTINGS — safe for any officer to edit!
#  Edit this file right in the GitHub website (pencil icon),
#  then go to Actions -> "Weekly Guild Board" -> "Run workflow"
#  to post an updated board immediately.
# ============================================================

guild:
  name: "Skill Issues"           # exactly as it appears on Warcraft Logs
  realm_slug: "bleeding-hollow"  # lowercase, spaces become dashes (e.g. "area-52")
  region: "us"                   # us / eu / kr / tw

# How many days of logs to include (7 = one raid week)
lookback_days: 7

# How many players shown per category (3, 4, or 5)
top_n: 5

# ============================================================
#  WHAT THE WEEKLY POST SHOWS
# ============================================================
#   paper    THE PAPER IS THE POST. The website's own four-page newspaper
#            (skill-issues-board.pages.dev/board/) is photographed and those
#            photographs are the attachments: page one, an above-the-fold
#            teaser cut for phones, and page two's Season Ladder. One
#            composition, one set of numbers, nothing to drift.
#   classic  the old behaviour: this repo renders its own board image from
#            its own templates (see `display.renderer` below).
#
# The paper path is GATED: parity_manifest.yml lists every datum the board
# used to publish, the run checks the fetched page for each one, and a post
# that would ship a paper missing any of them is REFUSED with a loud log. A
# browser or network fault is different -- that falls back to `classic` for
# the week rather than skipping it, so the guild always gets a board.
renderer: paper

# Board layout (used by `classic`):
#   image_board   — the whole board is rendered as one image (recommended:
#                   real aligned columns, class colors, identical on mobile)
#   single_column — plain text embed, one section per field
#   two_column    — legacy inline-field columns (Discord misaligns these; avoid)
display:
  # Where the paper lives. Only read when renderer: paper.
  paper_url: "https://skill-issues-board.pages.dev/board/"
  layout: image_board
  # Renderer: "html" screenshots the design's own HTML template in headless
  # Chromium (pixel-identical to the mockup); anything else, or any render
  # failure, falls back to the built-in Pillow painter automatically.
  renderer: html
  icons: true      # class/spec icons next to player names (fetched from Wowhead's CDN)
  watermark: true  # small "Powered by Guild Board" credit in the image corner
  # Artwork that frames the board: its top slice becomes the header banner
  # (great when the art carries the guild name) and its bottom slice the
  # footer. Missing file = plain board, no error.
  theme_art: "assets/theme_art.png"
  # Fun corner: the guild's flavor "item" rendered as a card in the footer
  # band (where the recruiting poster used to hang). Swap the file monthly
  # for a rotating gag.
  item_art: "assets/item_art.png"
  item_art_title: "GUILD ITEM OF THE MONTH"
  # Animated board: rising embers, flickering torches/campfire, swinging
  # sign, soul-wisps in the memorial (seamless looping GIF; 10 frames x
  # 120ms = 1.2s loop). Falls back to the static PNG automatically if the
  # GIF would exceed Discord's upload limit.
  animate: true
  animate_frames: 10
  # Phone-readable portrait companion image posted alongside the board.
  # OFF: the web board (linked from the post title and text) replaces it,
  # and the second image cluttered the post. Flip back on any time.
  mobile_companion: false
  # The "📱 Web Board" button on the Discord post links to the live site.
  # It now points at the new Cloudflare Pages site — the same newspaper the
  # `paper` renderer photographs. The old self-published GitHub Pages board
  # (Bzach10/wow-guild-board) is RETIRED: CI no longer renders or publishes
  # it, so there is no `repo`/WEB_BOARD_TOKEN to configure here anymore.
  web_board:
    enabled: true
    url: "https://skill-issues-board.pages.dev/"  # where the button points
  # NOTE: colors, backgrounds, fonts, header/footer modules and all the
  # gag text moved to theme.yml — see CUSTOMIZING.md. Any member can
  # safely edit that file.

# ------------------------------------------------------------
#  BOARD SECTIONS — each section has an order field to control
#  where it appears in the Discord embed. Lower numbers appear
#  first. Set enabled: false to skip a section.
# ------------------------------------------------------------
sections:
  # Guild announcement at the very top
  announcement:
    order: 0
    enabled: true
    title: "📢 Guild Announcement"
    text: "Welcome to the weekly board!"

  # Progress image (only used by single_column/two_column layouts;
  # image_board renders its own full board image instead)
  progress_image:
    order: 1
    enabled: true
    url: "https://www.warcraftlogs.com/embed/guild-progress-tile/46?difficulty=4&guild=821721"
    remove_on_failure: true  # Remove image section if URL fails to load

  # Notice when no logs are found (only appears if reports are empty)
  no_logs_notice:
    order: 2
    enabled: true
    message: "No raid logs found for the last {lookback_days} days. We need more guild players!"

  # Mythic+ section header
  mplus_header:
    order: 3
    enabled: true
    type: section_header
    title: "Mythic Plus"
    icon: "🗝️"

  # Mythic+ board — last week's highest keys (Raider.io weekly rotation)
  mplus:
    order: 4
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)
    # - "Rakell-Proudmoore"   # Example manual entry

  # Season-long M+ total scores (from Raider.io mythic_plus_scores)
  mplus_season_scores:
    order: 5
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)

  # Season-long top M+ runs (WCL parse percentiles, falls back to Raider.io best runs)
  mplus_season_parses:
    order: 6
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)
    use_wcl_parses: true       # Try WCL parse percentiles first
    fallback_to_raiderio: true # Fall back to Raider.io best runs if WCL fails

  # Raid section header
  raid_header:
    order: 7
    enabled: true
    type: section_header
    title: "Raid"
    icon: "⚔️"

  # Top DPS parses of the week
  top_dps:
    order: 8
    enabled: true
    difficulty: mythic             # normal / heroic / mythic
    difficulty_fallback: true      # Try mythic -> heroic -> normal sequentially

  # Top healing parses of the week
  top_healing:
    order: 9
    enabled: true
    difficulty: mythic             # normal / heroic / mythic
    difficulty_fallback: true      # Try mythic -> heroic -> normal sequentially

  # Top parses overall — every role on ONE ladder (DPS, healers and
  # tanks compete head to head at their best percentile)
  top_parses:
    order: 10
    enabled: true

  # Top M+ tanks section in the Mythic Plus column (tank-vs-tank
  # percentiles from WCL's tank bracket)
  top_tanks:
    order: 10
    enabled: true

  # Weekly raid boss ranks (WCL All Stars per-boss realm ranks).
  # OFF by guild decision — re-enable any time and it returns to the
  # top of the SEASONAL GUILD column.
  realm_rank_leaders:
    order: 11
    enabled: false
    max_characters: 30

  # Most deaths (Graveyard Camper award) — retired from the columns; the
  # Graveyard Memorial tombstones in the footer tell this story now.
  most_deaths:
    order: 11
    enabled: false

  # Guild Achievements section header
  guild_achievement_header:
    order: 12
    enabled: true
    type: section_header
    title: "Guild Achievements"
    icon: "🏆"

  # Overall guild realm rank (realm/region/world)
  overall_realm_rank:
    order: 13
    enabled: true

  # Legacy guild standing (disabled in favor of overall_realm_rank)
  guild_standing:
    order: 14
    enabled: false
    zone_id: 0                     # 0 = auto-detect from this week's logs
    max_characters: 30             # how many raiders to look up (1 API call each)

  # Weekly Mythic+ DPS/HPS — best dungeon parses from this week's WCL
  # M+ logs (players must upload their M+ runs to Warcraft Logs to appear)
  mplus_weekly_parses:
    order: 15
    enabled: true

  # Most Improved — biggest WCL parse gains across the season (early-season
  # best vs recent best, same raid zone; needs 2+ weeks of logs per player)
  most_improved_dps:
    order: 16
    enabled: true
    top_n: 5
  most_improved_healers:
    order: 17
    enabled: true
    top_n: 5

  # Roast of the week
  roast_of_the_week:
    order: 15
    enabled: true
    winner: "Rakdaddy"                     # who said it
    target: "Healmates"                     # which healer got flamed (optional)
    roast: "Healmates Sucks"                # the roast itself

# ------------------------------------------------------------
#  DISCORD INPUTS — let the guild feed the board from Discord.
#  Needs a bot token in the DISCORD_BOT_TOKEN repo secret and the
#  bot invited with "View Channel" + "Read Message History"
#  (see README "Discord-powered inputs" for the 5-minute setup).
#  - Roast channel: members post roasts, 🔥 reactions are votes;
#    the top-voted post of the week wins automatically.
#  - Announcement channel: lock it to officers/GM in Discord;
#    the latest message becomes the board announcement.
#  Right-click a channel -> "Copy Channel ID" (needs Developer
#  Mode under Discord Settings -> Advanced).
# ------------------------------------------------------------
competition:
  # The WANTED BOARD — daily M+ standings. Data always refreshes; this flag
  # only gates the optional daily Discord post (off by default so the daily
  # Action never surprise-posts). Set true to post the board like the old
  # guild board.
  daily_post: false

discord_inputs:
  enabled: true
  # Roast sources — channels AND their threads/forum posts are scanned.
  # With min_votes 1, an unvoted roast still counts (newest wins);
  # ties and votes are decided by 🔥 reactions.
  roast_channel_ids:
    - "1528109811693260961"   # roast submissions channel
    - "1524921429760409620"   # guild-board channel (roast threads under the weekly post)
  vote_emoji: "🔥"
  min_votes: 1
  announcement_channel_id: "1528114032941207582"  # officers-only channel

  # --- Guild Pulse: the website's living Discord feed --------------------
  # ONLY the channels listed here are ever read (allowlist). DMs and private
  # channels are never touched, and the bot can only read channels it's been
  # granted View + Read Message History on. Fill in your guild-PUBLIC social
  # channels; `kind` groups them in the feed (chat / memes / banter /
  # gambling). Leave pulse_channels empty to keep the feed off.
  pulse_channels: []
  #   - { id: "123...", label: "general",      kind: "chat" }
  #   - { id: "123...", label: "memes",        kind: "memes" }
  #   - { id: "123...", label: "bully-corner", kind: "banter" }
  #   - { id: "123...", label: "guild-casino", kind: "gambling" }
  pulse_lookback_days: 14        # how far back the feed looks
  pulse_per_channel_limit: 20    # max items kept per channel
  pulse_exclude_emoji: "🙈"       # react with this to drop a message
  pulse_opt_out_marker: "[nofeed]"  # put this in a message to drop it
  pulse_blocklist: []            # substrings that drop any matching message

# Roster cache — keeps the auto-fetched guild roster between runs.
# Refreshes automatically when older than max_age_days (new fetches are
# UNIONED with the old cache, so members never silently vanish).
roster_cache:
  enabled: true
  file: "roster_cache.json"
  max_age_days: 7

# ------------------------------------------------------------
#  BLIZZARD CHARACTER PROFILES (optional, off by default) — feeds future
#  character-likeness features: gender, race, class, active spec, and a
#  transmog render URL per character, straight from Blizzard's own API.
#  Needs a free Battle.net developer app + two repo secrets — nothing here
#  runs until BOTH `enabled: true` below AND BLIZZARD_CLIENT_ID/SECRET
#  exist. See SETUP_BLIZZARD.md. Does not touch the weekly board at all.
# ------------------------------------------------------------
blizzard:
  enabled: true
  cache_file: "blizzard_profile_cache.json"

# ------------------------------------------------------------
#  PARSES — per-character Warcraft Logs averages for the website
#  (the Four Emperors ranking's parse axis, standings parse
#  columns, newspaper raid sections). Data is pulled by the
#  "WCL Parse Refresh" Action; these knobs shape how it's SCORED,
#  and take effect on the next bundle rebuild — no re-pull needed.
# ------------------------------------------------------------
parses:
  # Scale factor applied to a character's best-performance average when
  # their parses come from a lower difficulty (a heroic 95 shouldn't
  # outrank a mythic 80 on the Emperor Index). 1.0 = no discount.
  # 0 = that difficulty is EXCLUDED entirely: its characters drop out of
  # the parses layer ("no logs yet" on the site) and the refresh sweep
  # stops querying it. The RAW averages always stay in the cache, so
  # flipping a factor back on later is loss-free.
  # Every ENABLED difficulty is fetched for every swept character (the
  # website shows mythic and heroic side by side).
  # See docs/PARSES_CONFIG_GUIDE.html.
  difficulty_scale:
    mythic: 1.0
    heroic: 0.8
    normal: 0.0    # excluded — normal-difficulty parses don't count

  # Who gets swept. "active" (recommended): only characters seen in the
  # guild's Warcraft Logs reports in the last active_days, plus anyone
  # already in the parse cache — most of the roster never raids, and
  # querying all 135 members every run wastes the API budget. A FULL
  # roster discovery sweep still runs every discovery_days so newly
  # active members (including pug raiders) are picked up. "full" sweeps
  # the whole roster every run.
  sweep: active
  active_days: 21      # how far back guild logs count as "active"
  discovery_days: 7    # full-roster discovery sweep at most this often

# ------------------------------------------------------------
#  RAID SETTINGS
# ------------------------------------------------------------
raid:
  enabled: true
  difficulty: mythic             # normal / heroic / mythic

# ------------------------------------------------------------
#  RANKINGS vs THE REGION — guild progress standing plus your
#  top players by Warcraft Logs All Stars realm rank.
# ------------------------------------------------------------
rankings:
  enabled: true
  zone_id: 0                     # 0 = auto-detect the current raid from this week's logs
  max_characters: 30             # how many raiders to look up (1 API call each)

# ------------------------------------------------------------
#  MULTIPLE LOGGERS — if two people upload the same raid, the
#  script automatically detects duplicate pulls so deaths and
#  pull counts aren't double-counted. Optionally name your
#  primary logger's Warcraft Logs USERNAME so their reports
#  win ties when the same pull appears in two logs.
# ------------------------------------------------------------
dedup:
  enabled: true
  preferred_uploader: ""         # WCL account name of your primary logger (optional)

# ------------------------------------------------------------
#  PUGS & ROSTER FILTERING — you run pugs, so choose whether
#  they appear on the board. guild_members_only pulls your
#  roster from Warcraft Logs automatically (no list to keep).
#  always_include = trials/friends not in guild yet.
#  always_exclude = anyone who should never appear.
# ------------------------------------------------------------
filters:
  guild_members_only: true
  # false = pugs can appear on the board
  always_include: []
    # - Sometrialname
  always_exclude: []
    # - Somename
