# ============================================================
#  GUILD BOARD SETTINGS — safe for any officer to edit!
#  Edit this file right in the GitHub website (pencil icon),
#  then go to Actions -> "Weekly Guild Board" -> "Run workflow"
#  to post an updated board immediately.
# ============================================================

guild:
  name: "Skill Issues"           # exactly as it appears on Warcraft Logs
  realm_slug: "bleeding-hollow"  # lowercase, spaces become dashes (e.g. "area-52")
  region: "us"                   # us / eu / kr / tw

# How many days of logs to include (7 = one raid week)
lookback_days: 7

# How many players shown per category (3, 4, or 5)
top_n: 5

# Board layout:
#   image_board   — the whole board is rendered as one image (recommended:
#                   real aligned columns, class colors, identical on mobile)
#   single_column — plain text embed, one section per field
#   two_column    — legacy inline-field columns (Discord misaligns these; avoid)
display:
  layout: image_board

# ------------------------------------------------------------
#  BOARD SECTIONS — each section has an order field to control
#  where it appears in the Discord embed. Lower numbers appear
#  first. Set enabled: false to skip a section.
# ------------------------------------------------------------
sections:
  # Guild announcement at the very top
  announcement:
    order: 0
    enabled: true
    title: "📢 Guild Announcement"
    text: "Welcome to the weekly board!"

  # Progress image (only used by single_column/two_column layouts;
  # image_board renders its own full board image instead)
  progress_image:
    order: 1
    enabled: true
    url: "https://www.warcraftlogs.com/embed/guild-progress-tile/46?difficulty=4&guild=821721"
    remove_on_failure: true  # Remove image section if URL fails to load

  # Notice when no logs are found (only appears if reports are empty)
  no_logs_notice:
    order: 2
    enabled: true
    message: "No raid logs found for the last {lookback_days} days. We need more guild players!"

  # Mythic+ section header
  mplus_header:
    order: 3
    enabled: true
    type: section_header
    title: "Mythic Plus"
    icon: "🗝️"

  # Mythic+ board — last week's highest keys (Raider.io weekly rotation)
  mplus:
    order: 4
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)
    # - "Rakell-Proudmoore"   # Example manual entry

  # Season-long M+ total scores (from Raider.io mythic_plus_scores)
  mplus_season_scores:
    order: 5
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)

  # Season-long top M+ runs (WCL parse percentiles, falls back to Raider.io best runs)
  mplus_season_parses:
    order: 6
    enabled: true
    auto_fetch_roster: true    # Auto-fetch from guild roster (recommended)
    roster: []                 # Manual override (leave empty for auto-fetch)
    use_wcl_parses: true       # Try WCL parse percentiles first
    fallback_to_raiderio: true # Fall back to Raider.io best runs if WCL fails

  # Raid section header
  raid_header:
    order: 7
    enabled: true
    type: section_header
    title: "Raid"
    icon: "⚔️"

  # Top DPS parses of the week
  top_dps:
    order: 8
    enabled: true
    difficulty: mythic             # normal / heroic / mythic
    difficulty_fallback: true      # Try mythic -> heroic -> normal sequentially

  # Top healing parses of the week
  top_healing:
    order: 9
    enabled: true
    difficulty: mythic             # normal / heroic / mythic
    difficulty_fallback: true      # Try mythic -> heroic -> normal sequentially

  # Weekly raid boss ranks (WCL All Stars per-boss realm ranks)
  realm_rank_leaders:
    order: 10
    enabled: true
    max_characters: 30

  # Most deaths (Graveyard Camper award)
  most_deaths:
    order: 11
    enabled: true

  # Guild Achievements section header
  guild_achievement_header:
    order: 12
    enabled: true
    type: section_header
    title: "Guild Achievements"
    icon: "🏆"

  # Overall guild realm rank (realm/region/world)
  overall_realm_rank:
    order: 13
    enabled: true

  # Legacy guild standing (disabled in favor of overall_realm_rank)
  guild_standing:
    order: 14
    enabled: false
    zone_id: 0                     # 0 = auto-detect from this week's logs
    max_characters: 30             # how many raiders to look up (1 API call each)

  # Most Improved — biggest WCL parse gains across the season (early-season
  # best vs recent best, same raid zone; needs 2+ weeks of logs per player)
  most_improved_dps:
    order: 16
    enabled: true
    top_n: 5
  most_improved_healers:
    order: 17
    enabled: true
    top_n: 2

  # Roast of the week
  roast_of_the_week:
    order: 15
    enabled: true
    winner: "Rakdaddy"                     # who said it
    target: "Healmates"                     # which healer got flamed (optional)
    roast: "Healmates Sucks"                # the roast itself

# ------------------------------------------------------------
#  DISCORD INPUTS — let the guild feed the board from Discord.
#  Needs a bot token in the DISCORD_BOT_TOKEN repo secret and the
#  bot invited with "View Channel" + "Read Message History"
#  (see README "Discord-powered inputs" for the 5-minute setup).
#  - Roast channel: members post roasts, 🔥 reactions are votes;
#    the top-voted post of the week wins automatically.
#  - Announcement channel: lock it to officers/GM in Discord;
#    the latest message becomes the board announcement.
#  Right-click a channel -> "Copy Channel ID" (needs Developer
#  Mode under Discord Settings -> Advanced).
# ------------------------------------------------------------
discord_inputs:
  enabled: false               # flip to true once the bot + channels exist
  roast_channel_id: ""         # e.g. "1234567890123456789"
  vote_emoji: "🔥"
  min_votes: 1                 # roasts need at least this many votes
  announcement_channel_id: ""  # officers-only channel

# Roster cache — keeps the auto-fetched guild roster between runs
roster_cache:
  enabled: true
  file: "roster_cache.json"

# ------------------------------------------------------------
#  RAID SETTINGS
# ------------------------------------------------------------
raid:
  enabled: true
  difficulty: mythic             # normal / heroic / mythic

# ------------------------------------------------------------
#  RANKINGS vs THE REGION — guild progress standing plus your
#  top players by Warcraft Logs All Stars realm rank.
# ------------------------------------------------------------
rankings:
  enabled: true
  zone_id: 0                     # 0 = auto-detect the current raid from this week's logs
  max_characters: 30             # how many raiders to look up (1 API call each)

# ------------------------------------------------------------
#  MULTIPLE LOGGERS — if two people upload the same raid, the
#  script automatically detects duplicate pulls so deaths and
#  pull counts aren't double-counted. Optionally name your
#  primary logger's Warcraft Logs USERNAME so their reports
#  win ties when the same pull appears in two logs.
# ------------------------------------------------------------
dedup:
  enabled: true
  preferred_uploader: ""         # WCL account name of your primary logger (optional)

# ------------------------------------------------------------
#  PUGS & ROSTER FILTERING — you run pugs, so choose whether
#  they appear on the board. guild_members_only pulls your
#  roster from Warcraft Logs automatically (no list to keep).
#  always_include = trials/friends not in guild yet.
#  always_exclude = anyone who should never appear.
# ------------------------------------------------------------
filters:
  guild_members_only: true
  # false = pugs can appear on the board
  always_include: []
    # - Sometrialname
  always_exclude: []
    # - Somename
